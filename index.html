<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snazzy Operations</title>
    <meta name="description" content="Internal operations platform for Snazzy Operations driving transparency, accountability, task management, and departmental health." />
    <meta property="og:title" content="Snazzy Operations" />
    <meta property="og:description" content="Internal operations platform for Snazzy Operations driving transparency, accountability, task management, and departmental health." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('snazzy_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
